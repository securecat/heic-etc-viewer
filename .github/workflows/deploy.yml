name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'heic-etc-viewer.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイが重なった場合は順番に実行し、実行中のものは取り消さない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # アップロードとデプロイを別のジョブに分ける（GitHubのPages用ワークフローのひな形と同じ形）。
  # 同じジョブの中でアップロード直後にデプロイすると、アップロードしたものがまだ見つからず
  # 失敗することがあるため
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy as index.html
        run: cp heic-etc-viewer.html index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
